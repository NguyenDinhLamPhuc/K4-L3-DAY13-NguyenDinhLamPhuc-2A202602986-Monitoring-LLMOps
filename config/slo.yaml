service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >-
    Mục tiêu lab là trả lời thành công trong 3 giây cho 99.5% request trong 28 ngày.
    Đây là mục tiêu đề xuất, cần đối chiếu với baseline thực đo trong REPORT.md.
    Error budget = tổng request * 0.005; 10,000 request cho phép 50 request không đạt.
    Request lỗi hoặc thành công chậm hơn 3000ms tiêu thụ budget, mỗi request chỉ tính một lần.
    Dữ liệu demo ngắn không chứng minh đã đạt SLO trong 28 ngày.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
