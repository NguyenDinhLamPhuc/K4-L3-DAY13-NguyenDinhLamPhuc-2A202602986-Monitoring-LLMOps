<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day 13 · Monitoring</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5fa;color:#19243b;font:15px system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:26px;margin:0}p{color:#52627a}button{background:#1d4ed8;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:22px}article{background:white;border:1px solid #dce3ee;border-radius:12px;padding:20px;min-width:0}h2{font-size:18px;margin:0 0 12px}.values{display:flex;gap:18px;flex-wrap:wrap}.value{font-size:23px;font-weight:650}.label{font-size:12px;color:#52627a}.threshold{font-size:13px;margin-top:12px;color:#52627a}svg{width:100%;height:160px;display:block;margin-top:12px}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px}.warning{color:#b45309}#status{min-height:20px}.axis{display:flex;justify-content:space-between;font-size:11px;color:#52627a}@media(max-width:750px){.grid{grid-template-columns:1fr}header{align-items:flex-start}main{padding:16px}}
</style>
<main>
<header><div><h1>Day 13 · Monitoring & LLMOps</h1><p id="range">Đang tải dữ liệu…</p></div><button id="refresh">Làm mới</button></header>
<div id="status" role="status"></div><div class="grid" id="panels"></div>
<p>Cửa sổ 60 phút · Tự cập nhật mỗi 30 giây · Token, cost và quality thuộc mô phỏng FakeLLM.</p>
</main>
<script>
const colors=['#2563eb','#0d9488','#9333ea','#d97706'];
const specs={latency:[['P50','p50'],['P95','p95'],['P99','p99'],['TTFT P95','ttft_p95']],traffic:[['Requests / phút','count']],errors:[['Error %','error_rate_pct'],['Retrieval success %','tool_success_rate_pct']],cost:[['USD / phút','total']],tokens:[['Input','tokens_in'],['Output','tokens_out']],quality:[['Quality','mean']]};
const titles={latency:'Latency percentiles and TTFT',traffic:'Request traffic',errors:'Error rate and retrieval success',cost:'Cost over time',tokens:'Input and output tokens',quality:'Quality proxy'};
function element(tag,text,className){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(className)e.className=className;return e}
function format(x){return x===null||x===undefined?'Chưa có dữ liệu':Number(x).toLocaleString('en-US',{maximumFractionDigits:6})}
function chart(parent,series,id,threshold){
 const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 560 160');svg.setAttribute('role','img');svg.setAttribute('aria-label',titles[id]);
 const entries=specs[id],values=entries.flatMap(([,key])=>series.map(r=>r[id][key])).filter(v=>v!==null);
 // Cost and token thresholds apply to window totals, shown in the panel text.
 const limit=['cost','tokens'].includes(id)?null:threshold.value;
 const max=Math.max(1,...values,limit||0)*1.1;
 const x=i=>40+i*510/Math.max(series.length-1,1),y=v=>135-v/max*120;
 function path(d,color,dash){const p=document.createElementNS(ns,'path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke',color);p.setAttribute('stroke-width','2');if(dash)p.setAttribute('stroke-dasharray','6 4');svg.append(p)}
 function label(text,py){const t=document.createElementNS(ns,'text');t.textContent=text;t.setAttribute('x','0');t.setAttribute('y',String(py));t.setAttribute('font-size','10');t.setAttribute('fill','#52627a');svg.append(t)}
 label(Number(max.toPrecision(3)),15);label('0',138);path('M40 10 V135 H550','#dce3ee');
 if(limit!==null)path(`M40 ${y(limit)} H550`,'#dc2626',true);
 const legend=element('div',undefined,'legend');
 entries.forEach(([name,key],k)=>{let d='',active=false;series.forEach((row,i)=>{const v=row[id][key];if(v===null){active=false;return}d+=`${active?'L':'M'}${x(i)} ${y(v)} `;active=true;const dot=document.createElementNS(ns,'circle');dot.setAttribute('cx',x(i));dot.setAttribute('cy',y(v));dot.setAttribute('r','2');dot.setAttribute('fill',colors[k]);const tip=document.createElementNS(ns,'title');tip.textContent=`${new Date(row.time).toLocaleString()} · ${name}: ${format(v)}`;dot.append(tip);svg.append(dot)});path(d,colors[k]);const l=element('span',name);l.style.color=colors[k];legend.append(l)});
 parent.append(svg);const axis=element('div',undefined,'axis');axis.append(element('span',new Date(series[0].time).toLocaleTimeString()),element('span',new Date(series.at(-1).time).toLocaleTimeString()));parent.append(axis,legend);
}
let timer;
async function refresh(){
 clearTimeout(timer);
 try{
  const response=await fetch('/dashboard/data',{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();
  document.querySelector('#range').textContent=`${new Date(data.start).toLocaleString()} → ${new Date(data.end).toLocaleString()} (${Intl.DateTimeFormat().resolvedOptions().timeZone})`;
  const status=document.querySelector('#status');status.textContent=data.event_count?`${data.event_count} events trong cửa sổ đang xem.`:'Chưa có dữ liệu trong 60 phút gần nhất. Hãy chạy workload rồi làm mới.';
  if(data.invalid_lines)status.textContent+=` Có ${data.invalid_lines} dòng không đọc được; hãy kiểm tra file log.`;
  const root=document.querySelector('#panels');root.replaceChildren();
  for(const panel of data.config.panels){const id=panel.id,card=element('article');card.append(element('h2',panel.title));const values=element('div',undefined,'values');let fields=specs[id];if(id==='traffic')fields=[['Tổng requests','count'],['Trung bình / phút','rate_per_minute']];if(id==='cost')fields=[['Tổng USD trong cửa sổ','total']];for(const [name,key] of fields){const box=element('div');box.append(element('div',format(data.summary[id][key]),'value'),element('div',name,'label'));values.append(box)}card.append(values);chart(card,data.series,id,panel.threshold);const t=panel.threshold;card.append(element('div',`${t.aggregation} ${t.operator==='lte'?'≤':'≥'} ${t.value} ${panel.unit}${['cost','tokens'].includes(id)?' · tổng trong cửa sổ':''}`,'threshold'));if(id==='errors'){card.append(element('div','Retrieval success mục tiêu ≥ 90% · '+(Object.entries(data.summary.errors.breakdown).map(([k,v])=>`${k}: ${v}`).join(', ')||'Không có lỗi ghi nhận'),'threshold'))}root.append(card)}
  timer=setTimeout(refresh,data.config.refresh_seconds*1000);
 }catch(error){document.querySelector('#status').textContent='Không thể cập nhật dashboard: '+error.message;timer=setTimeout(refresh,30000)}
}
document.querySelector('#refresh').addEventListener('click',refresh);refresh();
</script>
</html>
